name: PixAI daily check-in
on:
  schedule:
    # GitHub 예약 실행은 자주 늦거나 빠지므로 30분마다 실행한다.
    # 매번 출석과 토큰 갱신을 시도하고, 만료 4시간 이내면 만료 직전까지 기다렸다가 갱신한다.
    - cron: '23 * * * *'
    - cron: '53 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pixai-daily-checkin
  cancel-in-progress: false
jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 240 # 토큰 만료가 가까우면 만료 직전까지 기다렸다가 갱신하므로 길게 잡음
    steps:
      - uses: actions/checkout@v4
      - name: Restore refreshed tokens
        uses: actions/cache/restore@v4
        with:
          path: .pixai_tokens.json
          key: pixai-tokens-${{ github.run_id }}
          restore-keys: pixai-tokens-
      - name: Check in
        id: run
        run: python3 checkin.py
        env:
          PYTHONUNBUFFERED: '1'
          PIXAI_TOKEN: ${{ secrets.PIXAI_TOKEN }}
          PIXAI_MODE: claim
          PIXAI_WAIT_REFRESH: '1'
      - name: Save refreshed tokens
        if: always() && steps.run.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: .pixai_tokens.json
          key: pixai-tokens-${{ github.run_id }}-${{ github.run_attempt }}
