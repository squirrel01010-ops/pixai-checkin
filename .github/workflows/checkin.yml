name: PixAI daily check-in
on:
  schedule:
    - cron: '17 0 * * *'  # 출석: 매일 한국 시간 09:17
    - cron: '17 12 * * *' # 출석 재시도: 매일 한국 시간 21:17 (이미 받았으면 넘어감)
    - cron: '47 * * * *'  # 토큰 갱신 확인: 매시간 (만료 3시간 이내일 때만 실제 갱신)
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pixai-daily-checkin
  cancel-in-progress: false
jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Restore refreshed tokens
        uses: actions/cache/restore@v4
        with:
          path: .pixai_tokens.json
          key: pixai-tokens-${{ github.run_id }}
          restore-keys: pixai-tokens-
      - name: Check in
        id: run
        run: python3 checkin.py
        env:
          PIXAI_TOKEN: ${{ secrets.PIXAI_TOKEN }}
          PIXAI_MODE: ${{ github.event.schedule == '47 * * * *' && 'refresh' || 'claim' }}
      - name: Save refreshed tokens
        if: always() && steps.run.outputs.changed == 'true'
        uses: actions/cache/save@v4
        with:
          path: .pixai_tokens.json
          key: pixai-tokens-${{ github.run_id }}-${{ github.run_attempt }}
