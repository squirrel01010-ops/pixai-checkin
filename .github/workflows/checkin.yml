name: PixAI daily check-in
on:
  schedule:
    - cron: '17 0 * * *'  # 매일 한국 시간 09:17 (UTC 00:17)
    - cron: '17 12 * * *' # 매일 한국 시간 21:17 (재시도용, 이미 받았으면 그냥 넘어감)
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pixai-daily-checkin
  cancel-in-progress: false
jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python checkin.py
        env:
          PIXAI_TOKEN: ${{ secrets.PIXAI_TOKEN }}
